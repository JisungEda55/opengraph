<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image Maker - ShinJisung Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
    .og-container {
      width: 1200px;
      height: 630px;
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
    }
    .grain {
      background-image: 
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 80px 80px;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen pb-12">
  <div class="max-w-7xl mx-auto px-6 py-8">
    <h1 class="text-4xl font-bold mb-2 flex items-center gap-3">
      OG Image Maker <span class="text-amber-400">✦</span>
    </h1>
    <p class="text-zinc-400">실시간으로 예쁜 Open Graph &amp; Twitter Card 이미지를 만들어 보세요</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mt-10">
      <!-- 편집 패널 -->
      <div class="space-y-8">
        <div>
          <label class="block text-sm text-zinc-400 mb-2">템플릿 선택</label>
          <div class="flex gap-3 flex-wrap">
            <button onclick="switchTemplate(0)" class="template-btn active px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Glass Modern</button>
            <button onclick="switchTemplate(1)" class="template-btn px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Bold Typography</button>
            <button onclick="switchTemplate(2)" class="template-btn px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">Warm Organic</button>
          </div>
        </div>

        <div class="space-y-6">
          <div>
            <label class="block text-sm text-zinc-400 mb-2">메인 제목</label>
            <input id="title" type="text" value="지금까지 본 가장 아름다운 OG 이미지" 
                   oninput="updatePreview()" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-xl focus:outline-none focus:border-amber-400">
          </div>
          
          <div>
            <label class="block text-sm text-zinc-400 mb-2">설명</label>
            <textarea id="desc" oninput="updatePreview()" rows="3" 
                      class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl px-5 py-4 focus:outline-none focus:border-amber-400">2026년 트렌드를 반영한 OG 이미지를 브라우저에서 바로 제작하세요. 한글도 완벽 지원합니다.</textarea>
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm text-zinc-400 mb-2">사이트 이름</label>
              <input id="site" type="text" value="shinjisung.com" oninput="updatePreview()" 
                     class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4">
            </div>
            <div>
              <label class="block text-sm text-zinc-400 mb-2">배경 이미지 URL (선택)</label>
              <input id="bgurl" type="text" placeholder="https://picsum.photos/id/1015/1200/630" oninput="updatePreview()" 
                     class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4">
            </div>
          </div>
        </div>

        <button onclick="downloadImage()" 
                class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-black font-semibold py-5 rounded-3xl text-xl transition-all active:scale-95">
          📥 고해상도 PNG 다운로드 (1200×630)
        </button>
      </div>

      <!-- 미리보기 -->
      <div>
        <div class="mb-3 flex items-center justify-between">
          <p class="text-sm text-zinc-400">실시간 미리보기 (1200×630)</p>
          <button onclick="updatePreview()" class="text-xs px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl">새로고침</button>
        </div>
        
        <div class="flex justify-center bg-zinc-900 p-8 rounded-3xl overflow-auto">
          <div id="preview" class="og-container bg-zinc-900 relative overflow-hidden rounded-2xl flex flex-col justify-between">
            <!-- 배경 -->
            <div id="background" class="absolute inset-0 bg-cover bg-center transition-all"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-black/60 to-black/90"></div>
            
            <!-- 콘텐츠 -->
            <div class="relative p-16 flex flex-col h-full">
              <div id="site-name" class="text-amber-400 text-xl font-medium tracking-widest">SHINJISUNG.COM</div>
              
              <div class="mt-auto">
                <h1 id="preview-title" class="text-5xl leading-tight font-bold tracking-tighter text-white">
                  지금까지 본 가장 아름다운 OG 이미지
                </h1>
                <p id="preview-desc" class="mt-6 text-lg text-zinc-200 line-clamp-3">
                  2026년 트렌드를 반영한 OG 이미지를 브라우저에서 바로 제작하세요.
                </p>
              </div>
            </div>
            
            <!-- 하단 바 -->
            <div class="relative px-16 py-8 border-t border-white/10 flex items-center justify-between text-sm">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white/20 backdrop-blur-md rounded-2xl"></div>
                <div>
                  <div class="font-medium">ShinJisung</div>
                  <div class="text-zinc-400 text-xs">May 2026</div>
                </div>
              </div>
              <div class="text-right">
                <div class="text-amber-400 font-mono text-xl">01</div>
              </div>
            </div>
            
            <div class="grain absolute inset-0 pointer-events-none opacity-30"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTemplate = 0;

    function switchTemplate(n) {
      currentTemplate = n;
      document.querySelectorAll('.template-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === n);
        btn.classList.toggle('bg-amber-400', i === n);
        btn.classList.toggle('text-black', i === n);
      });
      updatePreview();
    }

    function updatePreview() {
      const title = document.getElementById('title').value;
      const desc = document.getElementById('desc').value;
      const site = document.getElementById('site').value;
      const bgurl = document.getElementById('bgurl').value;

      document.getElementById('preview-title').textContent = title || "제목을 입력하세요";
      document.getElementById('preview-desc').textContent = desc || "";
      document.getElementById('site-name').textContent = site.toUpperCase() || "YOUR-SITE.COM";

      const bgDiv = document.getElementById('background');
      if (bgurl) {
        bgDiv.style.backgroundImage = `url('${bgurl}')`;
      } else {
        bgDiv.style.backgroundImage = currentTemplate === 2 
          ? 'linear-gradient(135deg, #4f46e5, #ec4899)' 
          : 'url("https://picsum.photos/id/1015/1200/630")';
      }
    }

    async function downloadImage() {
      const preview = document.getElementById('preview');
      const loading = alert("이미지를 생성 중입니다... 잠시만 기다려주세요.");
      
      try {
        const canvas = await html2canvas(preview, {
          scale: 2,
          useCORS: true,
          backgroundColor: null
        });
        
        const link = document.createElement('a');
        link.download = `og-image-${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch(e) {
        alert("다운로드 중 오류가 발생했습니다.");
      }
    }

    // 초기화
    window.onload = () => {
      updatePreview();
    };
  </script>
</body>
</html>
